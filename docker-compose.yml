services:
  nginx:
    image: nginx:alpine
    container_name: gencsosyal-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gencsosyal-app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gencsosyal_net

  gencsosyal-postgres:
    image: postgres:16-alpine
    container_name: gencsosyal-postgres
    expose:
      - "5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gencsosyal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gencsosyal_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-genc_sosyal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gencsosyal} -d ${POSTGRES_DB:-genc_sosyal}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - gencsosyal_net

  gencsosyal-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gencsosyal-migrate
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_SSL=false
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-gencsosyal}:${POSTGRES_PASSWORD:-gencsosyal_db_pass}@gencsosyal-postgres:5432/${POSTGRES_DB:-genc_sosyal}?sslmode=disable}
    command: ["node", "dist-server/migrate.cjs"]
    depends_on:
      gencsosyal-postgres:
        condition: service_healthy
    networks:
      - gencsosyal_net

  gencsosyal-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gencsosyal-app
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_SSL=false
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-gencsosyal}:${POSTGRES_PASSWORD:-gencsosyal_db_pass}@gencsosyal-postgres:5432/${POSTGRES_DB:-genc_sosyal}?sslmode=disable}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      gencsosyal-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - gencsosyal_net

volumes:
  postgres_data:
  uploads_data:

networks:
  gencsosyal_net:
    driver: bridge
