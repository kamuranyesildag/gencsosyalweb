server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    
    # Redirect HTTP to HTTPS (Managed by Certbot later)
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (Path updated by Certbot)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # File uploads limits
    client_max_body_size 20M;

    # Static uploads routing for better performance
    # NOTE: Since uploads are stored in a Docker named volume, Nginx cannot directly
    # access them via an alias. We will let the Node.js app proxy serve them over port 3000.
    # location /uploads/ {
    #     alias /path/to/your/app/uploads/;
    #     expires 30d;
    #     access_log off;
    #     add_header Cache-Control "public, max-age=2592000";
    # }

    # Reverse proxy for Node.js App
    location / {
        proxy_pass http://127.0.0.1:3000; # Ensure this matches the PORT in your .env
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
