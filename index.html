<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genç Sosyal</title>
    <meta name="description" content="Gençlerin buluşma noktası: Genç Sosyal." />
    <meta name="keywords" content="genç sosyal, gençlik platformu, sosyal medya, yazılımcı gençlik, açık kaynak projeler, teknoloji topluluğu, genç geliştiriciler, öğrenci projeleri, portföy paylaşımı, yazılım projeleri, türk sosyal medya, dijital topluluk, kodlama" />
    <link rel="canonical" href="https://gencsosyal.com/" />
    
    <!-- Favicon & Browser Identity -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gencsosyal.com/" />
    <meta property="og:title" content="Genç Sosyal" />
    <meta property="og:description" content="Gençlerin buluşma noktası: Genç Sosyal." />
    <meta property="og:image" content="/icon-512.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://gencsosyal.com/" />
    <meta property="twitter:title" content="Genç Sosyal" />
    <meta property="twitter:description" content="Gençlerin buluşma noktası: Genç Sosyal." />
    <meta property="twitter:image" content="/icon-512.png" />
    
    <!-- Theme & App Branding -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('gencsosyal_theme') || localStorage.getItem('theme');
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root">
      <div id="initial-app-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:#ffffff;color:#0f172a;transition:background-color 0.2s ease;">
        <style>
          html.dark #initial-app-loader { background-color: #070A10 !important; color: #f8fafc !important; }
          @keyframes gsPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.96); opacity: 0.8; } }
          @keyframes gsSpin { to { transform: rotate(360deg); } }
          .gs-spin { animation: gsSpin 0.8s linear infinite; }
          .gs-pulse { animation: gsPulse 2s ease-in-out infinite; }
        </style>
        <div class="gs-pulse" style="width:52px;height:52px;border-radius:16px;background:#2563eb;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;letter-spacing:-0.5px;box-shadow:0 10px 25px -5px rgba(37,99,235,0.3);margin-bottom:18px;">
          GS
        </div>
        <div style="font-size:16px;font-weight:700;letter-spacing:-0.3px;margin-bottom:12px;">
          Genç <span style="color:#2563eb;">Sosyal</span>
        </div>
        <div class="gs-spin" style="width:22px;height:22px;border:2.5px solid #2563eb;border-top-color:transparent;border-radius:50%;"></div>
        <div id="initial-loader-timeout" style="display:none;margin-top:20px;text-align:center;">
          <p style="font-size:13px;opacity:0.75;margin-bottom:10px;">Yükleme beklenenden uzun sürdü.</p>
          <button onclick="window.location.reload()" style="background:#2563eb;color:#fff;border:none;padding:7px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">Sayfayı Yenile</button>
        </div>
      </div>
      <script>
        setTimeout(function() {
          var timeoutEl = document.getElementById('initial-loader-timeout');
          if (timeoutEl) timeoutEl.style.display = 'block';
        }, 6000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
